name: Tests
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim_version:
          - v0.10.4
          - stable
          - nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1.6.1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}
      - name: Fetch plenary.nvim (test dependency)
        run: |
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim .test-deps/plenary.nvim
      - name: Run tests
        run: |
          nvim --headless -u tests/minimal_init.lua -c "PlenaryBustedDirectory tests/ { minimal_init = 'tests/minimal_init.lua' }"
